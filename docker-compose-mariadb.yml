name: mariadb
services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: unless-stopped
    ports: ["3306:3306"]
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: database_name
      MARIADB_USER: database_user
      MARIADB_PASSWORD: user_password
    networks:
      - mariadb-net

networks:
  mariadb-net:
    external: true
